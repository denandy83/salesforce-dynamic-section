<template>
    <div class="nd-builder">

        <!-- Header: what object we're building for, and what to preview against -->
        <div class="slds-grid slds-wrap slds-gutters_small nd-topbar">
            <div class="slds-col slds-size_1-of-1 slds-medium-size_7-of-12">
                <!-- Recently viewed, so a preview target can be picked rather than typed -->
                <template if:true={hasRecentRecords}>
                    <lightning-combobox
                        label="Preview against"
                        value={previewRecordId}
                        options={recentRecordOptions}
                        onchange={handleRecentRecordChange}>
                    </lightning-combobox>
                </template>
                <template if:false={hasRecentRecords}>
                    <lightning-input
                        label="Preview against this record Id"
                        value={previewRecordId}
                        placeholder="500…"
                        onchange={handlePreviewIdChange}>
                    </lightning-input>
                </template>
            </div>
            <div class="slds-col slds-size_1-of-1 slds-medium-size_5-of-12">
                <!-- A case number is what someone reading a ticket actually has to hand -->
                <lightning-input
                    label="…or find by number / Id"
                    value={recordSearch}
                    placeholder="12024"
                    onchange={handleRecordSearch}>
                </lightning-input>
                <template if:true={recordSearchError}>
                    <p class="nd-import-error">{recordSearchError}</p>
                </template>
            </div>

        </div>

        <div class="slds-grid slds-wrap slds-gutters_small">

            <!-- ============ LEFT: the rows ============ -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <article class="slds-card nd-pane">
                    <div class="nd-pane-head">
                        <h2>Section</h2>
                    </div>

                    <!-- Section-level settings: title, icon, colours, layout, header alert.
                         These used to be separate App Builder properties. -->
                    <ul class="nd-rows nd-rows_section">
                        <li class={sectionRailClass}>
                            <button type="button" class="nd-row-btn" onclick={handleSelectSection}>
                                <span class="nd-row-title">
                                    <lightning-icon icon-name={sectionIconPreview} size="xx-small"
                                        alternative-text="Header icon"></lightning-icon>
                                    {sectionTitlePreview}
                                </span>
                                <span class="nd-row-api">title · icon · colours · layout</span>
                                <span class="nd-badges">
                                    <span class="nd-swatch nd-swatch_inline" style={sectionSwatchStyle}></span>
                                </span>
                            </button>
                        </li>
                    </ul>

                    <div class="nd-pane-head nd-pane-head_second">
                        <h2>Field rows</h2>
                        <span class="nd-count">{rowCountLabel}</span>
                    </div>

                    <template if:false={hasRows}>
                        <div class="nd-empty">
                            <p class="nd-empty-title">No field rows yet</p>
                            <p>Add one below, or paste an existing config to edit it.</p>
                        </div>
                    </template>

                    <ul class="nd-rows">
                        <template for:each={rowItems} for:item="row">
                            <li key={row.key} class={row.cssClass}>
                                <button
                                    type="button"
                                    class="nd-row-btn"
                                    data-index={row.index}
                                    onclick={handleSelectRow}>
                                    <span class="nd-row-title">
                                        <span class="nd-row-num">{row.number}</span>{row.title}
                                    </span>
                                    <span class="nd-row-api">{row.apiName}</span>
                                    <span class="nd-badges">
                                        <template for:each={row.badges} for:item="badge">
                                            <span key={badge.key} class={badge.cssClass}>{badge.label}</span>
                                        </template>
                                    </span>
                                </button>
                                <!-- Duplicate was dropped: a copied row has the same field,
                                     so it is invalid until the field is changed anyway. -->
                                <div class="nd-row-tools">
                                    <lightning-button-icon icon-name="utility:up" variant="border-filled"
                                        size="small" alternative-text="Move up" title="Move up"
                                        disabled={row.isFirst} data-index={row.index} data-step="-1"
                                        onclick={handleMoveRow}></lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:down" variant="border-filled"
                                        size="small" alternative-text="Move down" title="Move down"
                                        disabled={row.isLast} data-index={row.index} data-step="1"
                                        onclick={handleMoveRow}></lightning-button-icon>
                                    <lightning-button-icon icon-name="utility:delete" variant="border-filled"
                                        size="small" alternative-text="Remove" title="Remove"
                                        data-index={row.index}
                                        onclick={handleRemoveRow}></lightning-button-icon>
                                </div>
                            </li>
                        </template>
                    </ul>

                    <!-- One control: type and the list narrows as you go, click to add.
                         lightning-combobox has no type-ahead, and with 127 fields a plain
                         dropdown cannot be navigated. oninput rather than onchange, so it
                         filters while typing instead of when the box loses focus. -->
                    <div class="nd-adder">
                        <div class="nd-field-filter">
                            <lightning-input label="Add a field"
                                placeholder="Type to search, e.g. record type"
                                value={fieldSearch}
                                oninput={handleFieldSearch}
                                onchange={handleFieldSearch}></lightning-input>
                            <span class="nd-count">{fieldMatchCount}</span>
                        </div>

                        <!-- Not a field, so it does not belong in the field search list. -->
                        <lightning-button class="nd-add-divider" variant="neutral"
                            icon-name="utility:dash" label="Add a divider"
                            title="A rule across the section, optionally captioned"
                            onclick={handleAddDivider}></lightning-button>

                        <template if:false={hasFieldMatches}>
                            <p class="nd-help nd-no-match">No field matches that.</p>
                        </template>

                        <ul class="nd-matches">
                            <template for:each={fieldMatches} for:item="match">
                                <li key={match.key}>
                                    <button type="button" class={match.cssClass}
                                        data-field={match.apiName}
                                        onclick={handlePickField}>
                                        <span class="nd-match-label">{match.label}</span>
                                        <span class="nd-match-api">{match.apiName}</span>
                                        <template if:true={match.used}>
                                            <span class="nd-match-note">{match.note}</span>
                                        </template>
                                    </button>
                                </li>
                            </template>
                        </ul>
                    </div>
                </article>

                <!-- Config check -->
                <article class="slds-card nd-pane">
                    <div class="nd-pane-head">
                        <h2>Config check</h2>
                        <span class="nd-count">{findingSummary}</span>
                    </div>
                    <template if:false={hasFindings}>
                        <p class="nd-ok">No unknown keys, no conflicts.</p>
                    </template>
                    <ul class="nd-findings">
                        <template for:each={findingItems} for:item="finding">
                            <li key={finding.key} class={finding.cssClass}>
                                <lightning-icon icon-name={finding.icon} variant={finding.variant}
                                    size="xx-small" alternative-text="Finding"></lightning-icon>
                                <span class="nd-finding-text">{finding.text}</span>
                                <button type="button" class="nd-jump" data-index={finding.index}
                                    onclick={handleJumpToFinding}>Go</button>
                            </li>
                        </template>
                    </ul>
                </article>
            </div>

            <!-- ============ MIDDLE: the properties ============ -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <article class="slds-card nd-pane">
                    <template if:true={showNothingSelected}>
                        <div class="nd-empty">
                            <p class="nd-empty-title">Nothing selected</p>
                            <p>Pick <strong>Section</strong> or a field row on the left.</p>
                        </div>
                    </template>

                    <!-- SECTION SETTINGS -->
                    <template if:true={editingSection}>
                        <template for:each={sectionGroups} for:item="group">
                            <fieldset key={group.key} class="nd-group">
                                <legend>{group.legend}</legend>
                                <template if:true={group.conditions}>
                                    <c-n-d_conditions-editor
                                        site={group.conditions.site}
                                        legend={group.conditions.legend}
                                        help={group.conditions.help}
                                        group={group.conditions.group}
                                        field-options={group.conditions.fieldOptions}
                                        value-choices={group.conditions.valueChoices}
                                        field-types={group.conditions.fieldTypes}
                                        self-field-label={group.conditions.selfFieldLabel}
                                        self-field-value={group.conditions.selfFieldValue}
                                        onchange={handleConditionsChange}>
                                    </c-n-d_conditions-editor>
                                </template>

                                <template for:each={group.controls} for:item="ctrl">
                                    <div key={ctrl.key} class="nd-control">
                                        <template if:true={ctrl.isCheck}>
                                            <lightning-input type="checkbox" label={ctrl.title}
                                                checked={ctrl.checked} disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleSectionChange}></lightning-input>
                                        </template>
                                        <template if:true={ctrl.isText}>
                                            <lightning-input label={ctrl.label} value={ctrl.value}
                                                placeholder={ctrl.placeholder} disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleSectionChange}></lightning-input>
                                        </template>
                                        <template if:true={ctrl.isSelect}>
                                            <lightning-combobox label={ctrl.label} value={ctrl.value}
                                                options={ctrl.options} data-key={ctrl.key}
                                                onchange={handleSectionChange}></lightning-combobox>
                                        </template>
                                        <template if:true={ctrl.isFieldPicker}>
                                            <c-n-d_field-combobox
                                                label={ctrl.label} value={ctrl.value}
                                                options={ctrl.options}
                                                blank-label={ctrl.blankLabel}
                                                disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleSectionChange}></c-n-d_field-combobox>
                                        </template>
                                        <template if:true={ctrl.isValues}>
                                            <lightning-checkbox-group label={ctrl.label}
                                                options={ctrl.valueOptions}
                                                value={ctrl.selectedValues}
                                                disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleSectionChange}></lightning-checkbox-group>
                                        </template>
                                        <template if:true={ctrl.isValuesText}>
                                            <lightning-input label={ctrl.label} value={ctrl.value}
                                                placeholder={ctrl.placeholder} disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleSectionChange}></lightning-input>
                                        </template>

                                        <!-- Colour: a native picker for choosing, a text box
                                             for pasting a brand hex or a CSS colour name. -->
                                        <template if:true={ctrl.isColor}>
                                            <label class="nd-color-label">{ctrl.label}</label>
                                            <div class="nd-color-row">
                                                <!-- See the note in the field pane: input
                                                     fires during the drag, change only at
                                                     the end. -->
                                                <input type="color" class="nd-color-input"
                                                    value={ctrl.colorValue} data-key={ctrl.key}
                                                    title={ctrl.label}
                                                    oninput={handleSectionChange}
                                                    onchange={handleSectionChange} />
                                                <input type="text" class="nd-color-text"
                                                    value={ctrl.value} placeholder={ctrl.placeholder}
                                                    data-key={ctrl.key}
                                                    onchange={handleSectionChange} />
                                            </div>
                                        </template>

                                        <!-- Icon: type any name, or pick from the shortlist.
                                             The preview shows whatever is entered. -->
                                        <template if:true={ctrl.isIcon}>
                                            <div class="nd-icon-current">
                                                <lightning-icon icon-name={sectionIconPreview}
                                                    size="small"
                                                    alternative-text="Current icon"></lightning-icon>
                                                <lightning-input label={ctrl.label} value={ctrl.value}
                                                    placeholder={ctrl.placeholder} data-key={ctrl.key}
                                                    onchange={handleSectionChange}></lightning-input>
                                            </div>
                                            <div class="nd-icon-grid">
                                                <template for:each={iconChoices} for:item="choice">
                                                    <button key={choice.key} type="button"
                                                        class={choice.cssClass}
                                                        title={choice.name}
                                                        data-icon={choice.name}
                                                        onclick={handlePickIcon}>
                                                        <lightning-icon icon-name={choice.name}
                                                            size="x-small"
                                                            alternative-text={choice.name}></lightning-icon>
                                                    </button>
                                                </template>
                                            </div>
                                        </template>

                                        <p class="nd-help">
                                            <code>{ctrl.key}</code> — {ctrl.help}
                                        </p>
                                    </div>
                                </template>
                            </fieldset>
                        </template>
                    </template>

                    <!-- FIELD ROW -->
                    <template if:true={isEditingField}>
                        <template for:each={propertyGroups} for:item="group">
                            <fieldset key={group.key} class="nd-group">
                                <legend>{group.legend}</legend>

                                <!-- Widget choice is one radio group, so two widgets
                                     cannot be enabled at the same time. -->
                                <template if:true={group.isWidgetGroup}>
                                    <lightning-radio-group
                                        name="widget"
                                        label="Widget"
                                        variant="label-hidden"
                                        options={group.widgetOptions}
                                        value={group.widgetValue}
                                        onchange={handleWidgetChange}>
                                    </lightning-radio-group>
                                    <ul class="nd-widget-help">
                                        <template for:each={group.widgetHelp} for:item="w">
                                            <li key={w.key}><b>{w.title}</b> — {w.help}</li>
                                        </template>
                                    </ul>
                                </template>

                                <template if:true={group.conditions}>
                                    <c-n-d_conditions-editor
                                        site={group.conditions.site}
                                        legend={group.conditions.legend}
                                        help={group.conditions.help}
                                        group={group.conditions.group}
                                        field-options={group.conditions.fieldOptions}
                                        value-choices={group.conditions.valueChoices}
                                        field-types={group.conditions.fieldTypes}
                                        self-field-label={group.conditions.selfFieldLabel}
                                        self-field-value={group.conditions.selfFieldValue}
                                        onchange={handleConditionsChange}>
                                    </c-n-d_conditions-editor>
                                </template>

                                <template for:each={group.controls} for:item="ctrl">
                                    <div key={ctrl.key} class="nd-control">
                                        <template if:true={ctrl.isCheck}>
                                            <lightning-input type="checkbox" label={ctrl.title}
                                                checked={ctrl.checked} disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleControlChange}></lightning-input>
                                        </template>
                                        <template if:true={ctrl.isText}>
                                            <lightning-input label={ctrl.label} value={ctrl.value}
                                                placeholder={ctrl.placeholder} disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleControlChange}></lightning-input>
                                        </template>
                                        <template if:true={ctrl.isFieldPicker}>
                                            <c-n-d_field-combobox
                                                label={ctrl.label} value={ctrl.value}
                                                options={ctrl.options}
                                                blank-label={ctrl.blankLabel}
                                                disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleControlChange}></c-n-d_field-combobox>
                                        </template>
                                        <template if:true={ctrl.isRecordType}>
                                            <lightning-combobox label={ctrl.label} value={ctrl.value}
                                                options={ctrl.options} data-key={ctrl.key}
                                                onchange={handleControlChange}></lightning-combobox>
                                        </template>
                                        <!-- "…is one of": real choices when the watched
                                             field has them, free text when it does not.
                                             Stored as a comma-separated string either way. -->
                                        <template if:true={ctrl.isValues}>
                                            <lightning-checkbox-group label={ctrl.label}
                                                options={ctrl.valueOptions}
                                                value={ctrl.selectedValues}
                                                disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleControlChange}></lightning-checkbox-group>
                                        </template>
                                        <template if:true={ctrl.isValuesText}>
                                            <lightning-input label={ctrl.label} value={ctrl.value}
                                                placeholder={ctrl.placeholder} disabled={ctrl.disabled}
                                                data-key={ctrl.key}
                                                onchange={handleControlChange}></lightning-input>
                                        </template>
                                        <template if:true={ctrl.isSelect}>
                                            <lightning-combobox label={ctrl.label} value={ctrl.value}
                                                options={ctrl.options} data-key={ctrl.key}
                                                onchange={handleControlChange}></lightning-combobox>
                                        </template>
                                        <!-- Same colour control as the section panel: a
                                             native picker to choose with, a text box so a
                                             brand hex or CSS colour name still works. -->
                                        <template if:true={ctrl.isColor}>
                                            <label class="nd-color-label">{ctrl.label}</label>
                                            <div class="nd-color-row">
                                                <!-- oninput as well as onchange: a colour
                                                     input fires input continuously while
                                                     the picker is open but change only
                                                     once it closes, so without this the
                                                     preview lags behind the drag. -->
                                                <input type="color" class="nd-color-input"
                                                    value={ctrl.colorValue} data-key={ctrl.key}
                                                    title={ctrl.label}
                                                    oninput={handleControlChange}
                                                    onchange={handleControlChange} />
                                                <input type="text" class="nd-color-text"
                                                    value={ctrl.value} placeholder={ctrl.placeholder}
                                                    data-key={ctrl.key}
                                                    onchange={handleControlChange} />
                                            </div>
                                        </template>
                                        <p class="nd-help">
                                            <code>{ctrl.key}</code> — {ctrl.help}
                                        </p>
                                    </div>
                                </template>

                                <!-- Keys that only exist because of another choice -->
                                <template if:true={group.hasNested}>
                                    <div class="nd-nested">
                                        <template for:each={group.nestedControls} for:item="ctrl">
                                            <div key={ctrl.key} class="nd-control">
                                                <template if:true={ctrl.isCheck}>
                                                    <lightning-input type="checkbox" label={ctrl.title}
                                                        checked={ctrl.checked} disabled={ctrl.disabled}
                                                        data-key={ctrl.key}
                                                        onchange={handleControlChange}></lightning-input>
                                                </template>
                                                <template if:true={ctrl.isText}>
                                                    <lightning-input label={ctrl.label} value={ctrl.value}
                                                        placeholder={ctrl.placeholder}
                                                        disabled={ctrl.disabled} data-key={ctrl.key}
                                                        onchange={handleControlChange}></lightning-input>
                                                </template>
                                                <template if:true={ctrl.isFieldPicker}>
                                                    <c-n-d_field-combobox
                                                        label={ctrl.label} value={ctrl.value}
                                                        options={ctrl.options}
                                                        blank-label={ctrl.blankLabel}
                                                        disabled={ctrl.disabled}
                                                        data-key={ctrl.key}
                                                        onchange={handleControlChange}></c-n-d_field-combobox>
                                                </template>
                                                <template if:true={ctrl.isRecordType}>
                                                    <lightning-combobox label={ctrl.label}
                                                        value={ctrl.value} options={ctrl.options}
                                                        data-key={ctrl.key}
                                                        onchange={handleControlChange}></lightning-combobox>
                                                </template>
                                                <template if:true={ctrl.isValues}>
                                                    <lightning-checkbox-group label={ctrl.label}
                                                        options={ctrl.valueOptions}
                                                        value={ctrl.selectedValues}
                                                        disabled={ctrl.disabled}
                                                        data-key={ctrl.key}
                                                        onchange={handleControlChange}></lightning-checkbox-group>
                                                </template>
                                                <template if:true={ctrl.isValuesText}>
                                                    <lightning-input label={ctrl.label}
                                                        value={ctrl.value}
                                                        placeholder={ctrl.placeholder}
                                                        disabled={ctrl.disabled} data-key={ctrl.key}
                                                        onchange={handleControlChange}></lightning-input>
                                                </template>
                                                <p class="nd-help">
                                                    <code>{ctrl.key}</code> — {ctrl.help}
                                                </p>
                                            </div>
                                        </template>
                                    </div>
                                </template>

                                <!-- The rule in English, generated from the same schema
                                     module the record page uses. -->
                                <template if:true={group.sentence}>
                                    <p class="nd-sentence">{group.sentence}</p>
                                </template>
                            </fieldset>
                        </template>
                    </template>
                </article>
            </div>

            <!-- ============ RIGHT: preview + JSON ============ -->
            <div class="slds-col slds-size_1-of-1 slds-large-size_4-of-12">
                <article class="slds-card nd-pane">
                    <div class="nd-pane-head">
                        <h2>Live preview</h2>
                        <span class="nd-count">real component</span>
                    </div>

                    <template if:true={hasPreviewHint}>
                        <div class="nd-empty">
                            <p>{previewHint}</p>
                        </div>
                    </template>

                    <template if:true={canPreview}>
                        <div class="nd-preview">
                            <!-- ND_* properties start with an uppercase letter, so LWC
                                 cannot bind them from attributes. They are assigned
                                 programmatically in renderedCallback instead. -->
                            <c-n-d_-dynamic-section
                                record-id={previewRecordId}
                                object-api-name={objectApiName}>
                            </c-n-d_-dynamic-section>
                        </div>
                    </template>
                </article>

                <article class="slds-card nd-pane">
                    <div class="nd-pane-head">
                        <h2>Paste into ND_jsonConfigString</h2>
                        <span class="nd-count">{jsonLength}</span>
                    </div>
                    <!-- The button belongs with the thing it copies, not in the top bar -->
                    <div class="nd-json-actions">
                        <lightning-button
                            label={copyLabel}
                            variant="brand"
                            icon-name="utility:copy_to_clipboard"
                            onclick={handleCopy}
                            onmouseleave={handleCopyLabelReset}>
                        </lightning-button>
                    </div>
                    <pre class="nd-json">{jsonPretty}</pre>
                </article>

                <article class="slds-card nd-pane">
                    <div class="nd-pane-head">
                        <h2>Load an existing config</h2>
                    </div>
                    <!-- Deliberately NOT value-bound. lightning-textarea fires change on
                         blur, so a controlled value combined with any re-render before you
                         click away resets what you pasted. Read on Load instead. -->
                    <lightning-textarea
                        class="nd-import-box"
                        label="Paste the current ND_jsonConfigString"
                        placeholder={importPlaceholder}
                        onchange={handleImportChange}>
                    </lightning-textarea>
                    <template if:true={importError}>
                        <p class="nd-import-error">{importError}</p>
                    </template>
                    <template if:true={importNotice}>
                        <p class="nd-import-notice">{importNotice}</p>
                    </template>
                    <div class="nd-import-actions">
                        <lightning-button label="Load" onclick={handleImport}></lightning-button>
                        <lightning-button label="Clear all rows" variant="destructive-text"
                            onclick={handleClearAll}></lightning-button>
                    </div>
                </article>
            </div>
        </div>
    </div>
</template>
