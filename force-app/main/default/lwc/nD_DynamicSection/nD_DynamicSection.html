<template>
    <div class="nd-component-wrapper">
        <article class="nd-card">

            <div class="nd-header" style={ND_headerStyle} onclick={ND_toggleSection}>
                <div class="slds-media slds-media_center">
                    <div class="slds-media__figure">
                        <lightning-icon icon-name={resolvedIcon} size="x-small" variant="inverse"></lightning-icon>
                    </div>
                    <div class="slds-media__body">
                        <span class="nd-header-title" style={ND_titleStyle}>
                            {computedTitle}
                        </span>
                    </div>
                </div>
                <lightning-icon icon-name={ND_chevronIcon} size="x-small" variant="inverse"></lightning-icon>
            </div>

            <div if:true={ND_isOpen} class="nd-body">

                <!-- Nothing configured. A blank card gives whoever just dropped the
                     component no idea what to do next, so point at the tool. -->
                <template if:true={isUnconfigured}>
                    <div class="nd-setup">
                        <p class="nd-setup-title">This section has no fields yet</p>
                        <!-- Each sentence stays on ONE line. LWC collapses the whitespace
                             between a text node and an element when a newline sits
                             between them, which silently produced "chooseSection Config
                             Builder" and "Field JSON Configurationproperty". -->
                        <p class="nd-setup-body">Open the <strong>App Launcher</strong> and choose <strong>Section Config Builder</strong> to set up how this section should look: which fields it shows, the title, icon, colours and layout.</p>
                        <p class="nd-setup-body">Then click <strong>Copy JSON</strong> there and paste the result into the <strong>Field JSON Configuration</strong> property of this component.</p>
                    </div>
                </template>

                <lightning-record-edit-form
                    record-id={recordId}
                    object-api-name={objectApiName}
                    onsuccess={ND_handleSuccess}
                    onerror={ND_handleError}
                    onsubmit={ND_handleSubmit}>

                    <template if:true={saveError}>
                        <div class="nd-error" role="alert">
                            <lightning-icon class="nd-error-icon" icon-name="utility:error" variant="error" size="x-small"
                                alternative-text="Error"></lightning-icon>
                            <div class="nd-error-body">
                                <p class="nd-error-title">{saveError.title}</p>
                                <template if:true={saveError.hasItems}>
                                    <ul class="nd-error-list">
                                        <template for:each={saveError.items} for:item="item">
                                            <li key={item.key} class="nd-error-item">{item.text}</li>
                                        </template>
                                    </ul>
                                </template>
                            </div>
                            <lightning-button-icon class="nd-error-close" icon-name="utility:close" variant="bare"
                                size="x-small" alternative-text="Dismiss" title="Dismiss"
                                onclick={ND_dismissError}></lightning-button-icon>
                        </div>
                    </template>


                    <div class="slds-grid slds-wrap slds-gutters_small">

                        <template for:each={ND_finalFieldList} for:item="fieldConfig">
                            <template if:true={fieldConfig.isVisible}>

                                <!-- A divider: a rule across the section, optionally captioned.
                                     Keep the caption on ONE line with its rules — LWC collapses
                                     whitespace between a text node and an element. -->
                                <template if:true={fieldConfig.isDivider}>
                                    <div key={fieldConfig.key} class={fieldConfig.cssClass}>
                                        <div class={fieldConfig.dividerClass} role="separator">
                                            <template if:true={fieldConfig.hasCaption}><span class="nd-divider-caption">{fieldConfig.caption}</span></template>
                                        </div>
                                    </div>
                                </template>

                                <template if:false={fieldConfig.isDivider}>
                                <div key={fieldConfig.key} class={fieldConfig.cssClass}>
                                    <div class={fieldConfig.contentCssClass} style={fieldConfig.style}>

                                        <template if:true={fieldConfig.hasRecordLink}>
                                            <lightning-button-icon
                                                class="nd-url-icon"
                                                icon-name="utility:new_window"
                                                variant="bare"
                                                size="x-small"
                                                title="Open record"
                                                alternative-text="Open record"
                                                data-id={fieldConfig.recordLinkId}
                                                onclick={ND_handleOpenRecord}>
                                            </lightning-button-icon>
                                        </template>

                                        <template if:true={fieldConfig.customLabel}>
                                            <div class={fieldConfig.labelCssClass} title={fieldConfig.customLabel}>{fieldConfig.customLabel}</div>
                                            <template if:true={fieldConfig.isUrl}>
                                                <template if:true={fieldConfig.showUrlLink}>
                                                    <div class="nd-url-value">
                                                        <a href={fieldConfig.urlHref} target="_blank" rel="noopener" class="nd-url-link" title={fieldConfig.urlValue}>{fieldConfig.urlValue}</a>
                                                        <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                            alternative-text="Remove" title="Remove"
                                                            data-field={fieldConfig.apiName} onclick={ND_handleUrlClear}></lightning-button-icon>
                                                    </div>
                                                </template>
                                                <template if:true={fieldConfig.showUrlInput}>
                                                    <lightning-input type="url" variant="label-hidden"
                                                        placeholder={fieldConfig.urlPlaceholder}
                                                        value={fieldConfig.urlValue}
                                                        data-field={fieldConfig.apiName}
                                                        onfocus={ND_handleUrlFocus}
                                                        onchange={ND_handleUrlInput}></lightning-input>
                                                </template>
                                            </template>
                                            <template if:true={fieldConfig.isUrlList}>
                                                <div class="nd-links">
                                                    <template if:true={fieldConfig.urlListHasItems}>
                                                        <template for:each={fieldConfig.urlListItems} for:item="lnk">
                                                            <div key={lnk.key} class="nd-link-row">
                                                                <lightning-icon icon-name="utility:link" size="xx-small" class="nd-link-ic"></lightning-icon>
                                                                <a class="nd-link-a" href={lnk.href} target="_blank" rel="noopener" title={lnk.url}>{lnk.label}</a>
                                                                <lightning-button-icon icon-name="utility:edit" variant="bare" size="x-small"
                                                                    alternative-text="Edit" title="Edit"
                                                                    data-field={fieldConfig.apiName} data-id={lnk.id} onclick={ND_urlListEditOpen}></lightning-button-icon>
                                                                <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                                    alternative-text="Remove" title="Remove"
                                                                    data-field={fieldConfig.apiName} data-id={lnk.id} onclick={ND_urlListRemove}></lightning-button-icon>
                                                            </div>
                                                        </template>
                                                    </template>
                                                    <button type="button" class="nd-link-addtrigger" data-field={fieldConfig.apiName} onclick={ND_urlListAddOpen}>
                                                        <lightning-icon icon-name="utility:add" size="xx-small" class="nd-link-addtrigger-ic"></lightning-icon>
                                                        <span>Add link</span>
                                                    </button>
                                                </div>
                                            </template>
                                            <template if:true={fieldConfig.isEmailList}>
                                                <div class="nd-emails">
                                                    <template if:true={fieldConfig.emailList.hasAny}>
                                                        <button type="button" class="nd-emails-cluster" data-field={fieldConfig.apiName}
                                                            aria-expanded={fieldConfig.emailList.expanded} onclick={ND_emailListToggle}>
                                                            <span class="nd-avatars">
                                                                <template for:each={fieldConfig.emailList.cluster} for:item="person">
                                                                    <span key={person.key} class={person.avatarClass} title={person.email}>
                                                                        <template if:true={person.hasPhoto}>
                                                                            <img class="nd-avatar-img" src={person.photoUrl} alt="" />
                                                                        </template>
                                                                        <template if:false={person.hasPhoto}>{person.initials}</template>
                                                                    </span>
                                                                </template>
                                                                <template if:true={fieldConfig.emailList.hasOverflow}>
                                                                    <span class="nd-avatar nd-avatar_more">{fieldConfig.emailList.overflowLabel}</span>
                                                                </template>
                                                            </span>
                                                            <span class="nd-emails-meta">
                                                                <span class="nd-emails-count">{fieldConfig.emailList.countLabel}</span>
                                                                <span class="nd-emails-sub">{fieldConfig.emailList.metaLabel}</span>
                                                            </span>
                                                            <lightning-icon class="nd-emails-chev" icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                                                        </button>
                                                    </template>
                                                    <template if:true={fieldConfig.emailList.showEmptyAdd}>
                                                        <button type="button" class="nd-emails-empty" data-field={fieldConfig.apiName} onclick={ND_emailListToggle}>
                                                            <lightning-icon icon-name="utility:add" size="xx-small" class="nd-emails-empty-ic"></lightning-icon>
                                                            <span>Add people</span>
                                                        </button>
                                                    </template>
                                                    <template if:true={fieldConfig.emailList.showEmptyText}>
                                                        <span class="nd-emails-none">None</span>
                                                    </template>
                                                    <div class="nd-emails-panel" hidden={fieldConfig.emailList.rosterHidden}>
                                                        <div class="nd-roster">
                                                        <template for:each={fieldConfig.emailList.rows} for:item="person">
                                                            <div key={person.key} class="nd-roster-row">
                                                                <span class={person.avatarClass}>
                                                                    <template if:true={person.hasPhoto}>
                                                                        <img class="nd-avatar-img" src={person.photoUrl} alt="" />
                                                                    </template>
                                                                    <template if:false={person.hasPhoto}>{person.initials}</template>
                                                                </span>
                                                                <span class="nd-roster-id">
                                                                    <template if:true={person.hasLink}>
                                                                        <span class="nd-roster-name nd-roster-name_link" title={person.email}
                                                                            data-id={person.recordId} onclick={ND_emailListOpenRecord}>{person.name}</span>
                                                                    </template>
                                                                    <template if:false={person.hasLink}>
                                                                        <span class="nd-roster-name" title={person.email}>{person.name}</span>
                                                                    </template>
                                                                    <span class="nd-roster-sub">{person.subtitle}</span>
                                                                </span>
                                                                <template if:true={fieldConfig.emailList.canEdit}>
                                                                    <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                                        alternative-text="Remove" title="Remove" data-field={fieldConfig.apiName}
                                                                        data-email={person.email} onclick={ND_emailListRemove}></lightning-button-icon>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        </div>
                                                        <template if:true={fieldConfig.emailList.canEdit}>
                                                            <div class="nd-roster-add">
                                                                <lightning-input type="text" variant="label-hidden" class="nd-roster-input"
                                                                    placeholder={fieldConfig.emailPlaceholder} value={fieldConfig.emailList.draft}
                                                                    data-field={fieldConfig.apiName} onchange={ND_emailListDraftChange}
                                                                    onkeydown={ND_emailListDraftKey}></lightning-input>
                                                                <lightning-button-icon icon-name="utility:add" variant="border-filled" size="x-small"
                                                                    alternative-text="Add" title="Add" data-field={fieldConfig.apiName}
                                                                    onclick={ND_emailListAdd}></lightning-button-icon>
                                                            </div>
                                                            <template if:true={fieldConfig.emailList.hasError}>
                                                                <p class="nd-roster-error" role="alert">{fieldConfig.emailList.error}</p>
                                                            </template>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                            <template if:false={fieldConfig.editable}>
                                                <template if:false={fieldConfig.isUrl}>
                                                    <template if:false={fieldConfig.isUrlList}>
                                                        <template if:false={fieldConfig.isEmailList}>
                                                            <lightning-output-field class={fieldConfig.fieldCssClass} field-name={fieldConfig.apiName} variant="label-hidden"></lightning-output-field>
                                                        </template>
                                                    </template>
                                                </template>
                                            </template>
                                            <template if:true={fieldConfig.editable}>
                                                <template if:true={fieldConfig.isRecordType}>
                                                    <lightning-combobox
                                                        name={fieldConfig.apiName}
                                                        label={fieldConfig.customLabel}
                                                        value={selectedRecordTypeId}
                                                        options={recordTypeOptions}
                                                        onchange={ND_handleRecordTypeChange}
                                                        variant="label-hidden">
                                                    </lightning-combobox>
                                                </template>
                                                <template if:true={fieldConfig.isOwner}>
                                                    <div class="slds-grid slds-gutters_xx-small">
                                                        <template if:true={ownerEditMode}>
                                                            <div class="slds-col slds-grow-none" style="flex: none; width: 5.2rem;">
                                                                <lightning-combobox
                                                                    label="Owner type"
                                                                    variant="label-hidden"
                                                                    value={ownerPickerMode}
                                                                    options={ownerModeOptions}
                                                                    onchange={ND_handleOwnerModeChange}>
                                                                </lightning-combobox>
                                                            </div>
                                                        </template>
                                                        <div class="slds-col">
                                                            <template if:true={isOwnerModeUser}>
                                                                <lightning-record-picker
                                                                    label="Owner"
                                                                    variant="label-hidden"
                                                                    placeholder="Search Users..."
                                                                    object-api-name="User"
                                                                    filter={ownerUserFilter}
                                                                    value={selectedOwnerId}
                                                                    onchange={ND_handleOwnerChange}>
                                                                </lightning-record-picker>
                                                            </template>
                                                            <template if:false={isOwnerModeUser}>
                                                                <lightning-record-picker
                                                                    label="Owner"
                                                                    variant="label-hidden"
                                                                    placeholder="Search Queues..."
                                                                    object-api-name="Group"
                                                                    filter={queueFilter}
                                                                    value={selectedOwnerId}
                                                                    onchange={ND_handleOwnerChange}>
                                                                </lightning-record-picker>
                                                            </template>
                                                        </div>
                                                    </div>
                                                    <template if:false={isOwnedByCurrentUser}>
                                                        <a class={takeLinkClass} onclick={ND_handleTakeOwnership}>{takeLinkLabel}</a>
                                                    </template>
                                                    <template if:true={ownerNotice}>
                                                        <div class={ownerNoticeClass}>{ownerNotice}</div>
                                                    </template>
                                                </template>
                                                <template if:true={fieldConfig.isOpenProblem}>
                                                    <template if:true={fieldConfig.hasSelectedProblem}>
                                                        <div class="nd-problem-selected">
                                                            <span class="nd-problem-selected-text" title={fieldConfig.selectedProblemLabel}
                                                                  data-id={fieldConfig.selectedProblemId} onclick={ND_handleOpenRecord}>{fieldConfig.selectedProblemLabel}</span>
                                                            <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                                alternative-text="Clear" title="Clear"
                                                                data-field={fieldConfig.apiName} onclick={ND_handleProblemClear}></lightning-button-icon>
                                                        </div>
                                                    </template>
                                                    <template if:false={fieldConfig.hasSelectedProblem}>
                                                        <button type="button" class="nd-problem-trigger" data-field={fieldConfig.apiName} onclick={ND_openProblemModal}>
                                                            <lightning-icon icon-name="utility:search" size="xx-small" class="nd-problem-trigger-icon"></lightning-icon>
                                                            <span>{fieldConfig.pickerPlaceholder}</span>
                                                        </button>
                                                    </template>
                                                </template>
                                                <template if:false={fieldConfig.isRecordType}>
                                                    <template if:false={fieldConfig.isOwner}>
                                                        <template if:false={fieldConfig.isOpenProblem}>
                                                            <template if:false={fieldConfig.isUrl}>
                                                                <template if:false={fieldConfig.isUrlList}>
                                                                    <template if:false={fieldConfig.isEmailList}>
                                                                        <lightning-input-field class={fieldConfig.fieldCssClass} field-name={fieldConfig.apiName} variant="label-hidden" onchange={ND_handleFieldChange}></lightning-input-field>
                                                                    </template>
                                                                </template>
                                                            </template>
                                                        </template>
                                                    </template>
                                                </template>
                                            </template>
                                        </template>

                                        <template if:false={fieldConfig.customLabel}>
                                            <template if:true={fieldConfig.isUrl}>
                                                <template if:true={fieldConfig.showUrlLink}>
                                                    <div class="nd-url-value">
                                                        <a href={fieldConfig.urlHref} target="_blank" rel="noopener" class="nd-url-link" title={fieldConfig.urlValue}>{fieldConfig.urlValue}</a>
                                                        <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                            alternative-text="Remove" title="Remove"
                                                            data-field={fieldConfig.apiName} onclick={ND_handleUrlClear}></lightning-button-icon>
                                                    </div>
                                                </template>
                                                <template if:true={fieldConfig.showUrlInput}>
                                                    <lightning-input type="url" variant="label-hidden"
                                                        placeholder={fieldConfig.urlPlaceholder}
                                                        value={fieldConfig.urlValue}
                                                        data-field={fieldConfig.apiName}
                                                        onfocus={ND_handleUrlFocus}
                                                        onchange={ND_handleUrlInput}></lightning-input>
                                                </template>
                                            </template>
                                            <template if:true={fieldConfig.isUrlList}>
                                                <div class="nd-links">
                                                    <template if:true={fieldConfig.urlListHasItems}>
                                                        <template for:each={fieldConfig.urlListItems} for:item="lnk">
                                                            <div key={lnk.key} class="nd-link-row">
                                                                <lightning-icon icon-name="utility:link" size="xx-small" class="nd-link-ic"></lightning-icon>
                                                                <a class="nd-link-a" href={lnk.href} target="_blank" rel="noopener" title={lnk.url}>{lnk.label}</a>
                                                                <lightning-button-icon icon-name="utility:edit" variant="bare" size="x-small"
                                                                    alternative-text="Edit" title="Edit"
                                                                    data-field={fieldConfig.apiName} data-id={lnk.id} onclick={ND_urlListEditOpen}></lightning-button-icon>
                                                                <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                                    alternative-text="Remove" title="Remove"
                                                                    data-field={fieldConfig.apiName} data-id={lnk.id} onclick={ND_urlListRemove}></lightning-button-icon>
                                                            </div>
                                                        </template>
                                                    </template>
                                                    <button type="button" class="nd-link-addtrigger" data-field={fieldConfig.apiName} onclick={ND_urlListAddOpen}>
                                                        <lightning-icon icon-name="utility:add" size="xx-small" class="nd-link-addtrigger-ic"></lightning-icon>
                                                        <span>Add link</span>
                                                    </button>
                                                </div>
                                            </template>
                                            <template if:true={fieldConfig.isEmailList}>
                                                <div class="nd-emails">
                                                    <template if:true={fieldConfig.emailList.hasAny}>
                                                        <button type="button" class="nd-emails-cluster" data-field={fieldConfig.apiName}
                                                            aria-expanded={fieldConfig.emailList.expanded} onclick={ND_emailListToggle}>
                                                            <span class="nd-avatars">
                                                                <template for:each={fieldConfig.emailList.cluster} for:item="person">
                                                                    <span key={person.key} class={person.avatarClass} title={person.email}>
                                                                        <template if:true={person.hasPhoto}>
                                                                            <img class="nd-avatar-img" src={person.photoUrl} alt="" />
                                                                        </template>
                                                                        <template if:false={person.hasPhoto}>{person.initials}</template>
                                                                    </span>
                                                                </template>
                                                                <template if:true={fieldConfig.emailList.hasOverflow}>
                                                                    <span class="nd-avatar nd-avatar_more">{fieldConfig.emailList.overflowLabel}</span>
                                                                </template>
                                                            </span>
                                                            <span class="nd-emails-meta">
                                                                <span class="nd-emails-count">{fieldConfig.emailList.countLabel}</span>
                                                                <span class="nd-emails-sub">{fieldConfig.emailList.metaLabel}</span>
                                                            </span>
                                                            <lightning-icon class="nd-emails-chev" icon-name="utility:chevrondown" size="xx-small"></lightning-icon>
                                                        </button>
                                                    </template>
                                                    <template if:true={fieldConfig.emailList.showEmptyAdd}>
                                                        <button type="button" class="nd-emails-empty" data-field={fieldConfig.apiName} onclick={ND_emailListToggle}>
                                                            <lightning-icon icon-name="utility:add" size="xx-small" class="nd-emails-empty-ic"></lightning-icon>
                                                            <span>Add people</span>
                                                        </button>
                                                    </template>
                                                    <template if:true={fieldConfig.emailList.showEmptyText}>
                                                        <span class="nd-emails-none">None</span>
                                                    </template>
                                                    <div class="nd-emails-panel" hidden={fieldConfig.emailList.rosterHidden}>
                                                        <div class="nd-roster">
                                                        <template for:each={fieldConfig.emailList.rows} for:item="person">
                                                            <div key={person.key} class="nd-roster-row">
                                                                <span class={person.avatarClass}>
                                                                    <template if:true={person.hasPhoto}>
                                                                        <img class="nd-avatar-img" src={person.photoUrl} alt="" />
                                                                    </template>
                                                                    <template if:false={person.hasPhoto}>{person.initials}</template>
                                                                </span>
                                                                <span class="nd-roster-id">
                                                                    <template if:true={person.hasLink}>
                                                                        <span class="nd-roster-name nd-roster-name_link" title={person.email}
                                                                            data-id={person.recordId} onclick={ND_emailListOpenRecord}>{person.name}</span>
                                                                    </template>
                                                                    <template if:false={person.hasLink}>
                                                                        <span class="nd-roster-name" title={person.email}>{person.name}</span>
                                                                    </template>
                                                                    <span class="nd-roster-sub">{person.subtitle}</span>
                                                                </span>
                                                                <template if:true={fieldConfig.emailList.canEdit}>
                                                                    <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                                        alternative-text="Remove" title="Remove" data-field={fieldConfig.apiName}
                                                                        data-email={person.email} onclick={ND_emailListRemove}></lightning-button-icon>
                                                                </template>
                                                            </div>
                                                        </template>
                                                        </div>
                                                        <template if:true={fieldConfig.emailList.canEdit}>
                                                            <div class="nd-roster-add">
                                                                <lightning-input type="text" variant="label-hidden" class="nd-roster-input"
                                                                    placeholder={fieldConfig.emailPlaceholder} value={fieldConfig.emailList.draft}
                                                                    data-field={fieldConfig.apiName} onchange={ND_emailListDraftChange}
                                                                    onkeydown={ND_emailListDraftKey}></lightning-input>
                                                                <lightning-button-icon icon-name="utility:add" variant="border-filled" size="x-small"
                                                                    alternative-text="Add" title="Add" data-field={fieldConfig.apiName}
                                                                    onclick={ND_emailListAdd}></lightning-button-icon>
                                                            </div>
                                                            <template if:true={fieldConfig.emailList.hasError}>
                                                                <p class="nd-roster-error" role="alert">{fieldConfig.emailList.error}</p>
                                                            </template>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                            <template if:false={fieldConfig.editable}>
                                                <template if:false={fieldConfig.isUrl}>
                                                    <template if:false={fieldConfig.isUrlList}>
                                                        <template if:false={fieldConfig.isEmailList}>
                                                            <lightning-output-field field-name={fieldConfig.apiName} variant="label-stacked"></lightning-output-field>
                                                        </template>
                                                    </template>
                                                </template>
                                            </template>
                                            <template if:true={fieldConfig.editable}>
                                                <template if:true={fieldConfig.isRecordType}>
                                                     <lightning-combobox
                                                        name={fieldConfig.apiName}
                                                        label="Record Type"
                                                        value={selectedRecordTypeId}
                                                        options={recordTypeOptions}
                                                        onchange={ND_handleRecordTypeChange}
                                                        variant="label-stacked">
                                                    </lightning-combobox>
                                                </template>
                                                <template if:true={fieldConfig.isOpenProblem}>
                                                    <template if:true={fieldConfig.hasSelectedProblem}>
                                                        <div class="nd-problem-selected">
                                                            <span class="nd-problem-selected-text" title={fieldConfig.selectedProblemLabel}
                                                                  data-id={fieldConfig.selectedProblemId} onclick={ND_handleOpenRecord}>{fieldConfig.selectedProblemLabel}</span>
                                                            <lightning-button-icon icon-name="utility:close" variant="bare" size="x-small"
                                                                alternative-text="Clear" title="Clear"
                                                                data-field={fieldConfig.apiName} onclick={ND_handleProblemClear}></lightning-button-icon>
                                                        </div>
                                                    </template>
                                                    <template if:false={fieldConfig.hasSelectedProblem}>
                                                        <button type="button" class="nd-problem-trigger" data-field={fieldConfig.apiName} onclick={ND_openProblemModal}>
                                                            <lightning-icon icon-name="utility:search" size="xx-small" class="nd-problem-trigger-icon"></lightning-icon>
                                                            <span>{fieldConfig.pickerPlaceholder}</span>
                                                        </button>
                                                    </template>
                                                </template>
                                                <template if:false={fieldConfig.isRecordType}>
                                                    <template if:false={fieldConfig.isOpenProblem}>
                                                        <template if:false={fieldConfig.isUrl}>
                                                            <template if:false={fieldConfig.isUrlList}>
                                                                <template if:false={fieldConfig.isEmailList}>
                                                                    <lightning-input-field field-name={fieldConfig.apiName} variant="label-stacked" onchange={ND_handleFieldChange}></lightning-input-field>
                                                                </template>
                                                            </template>
                                                        </template>
                                                    </template>
                                                </template>
                                            </template>
                                        </template>

                                    </div>
                                </div>
                                </template>
                            </template>
                        </template>

                        <button class="nd-hidden-submit" type="submit" tabindex="-1"
                            aria-hidden="true" data-role="silent-submit"></button>

                        <template if:true={isDirty}>
                            <div class="slds-col slds-size_1-of-1 slds-p-top_medium slds-text-align_right nd-save-row">
                                <template if:true={isSaving}>
                                    <div class="nd-inline-spinner">
                                        <lightning-spinner size="x-small" variant="brand" alternative-text="Saving"></lightning-spinner>
                                    </div>
                                </template>
                                <lightning-button
                                    variant="neutral"
                                    type="button"
                                    label="Cancel"
                                    disabled={isSaving}
                                    onclick={ND_handleCancel}>
                                </lightning-button>
                                <lightning-button
                                    variant="brand"
                                    type="submit"
                                    label={saveButtonLabel}
                                    icon-name="utility:save"
                                    disabled={isSaving}>
                                </lightning-button>
                            </div>
                        </template>

                    </div>
                </lightning-record-edit-form>

                <template if:true={isProblemModalOpen}>
                    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="nd-problem-modal-heading"
                             class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <lightning-button-icon icon-name="utility:close" variant="bare" size="large"
                                    alternative-text="Close" title="Close"
                                    class="slds-modal__close nd-modal-close" onclick={ND_closeProblemModal}></lightning-button-icon>
                                <h2 id="nd-problem-modal-heading" class="slds-modal__title slds-hyphenate">Select an open Problem</h2>
                            </header>
                            <div class="slds-modal__content slds-p-around_medium nd-problem-modal-content">
                                <lightning-input type="search" variant="label-hidden"
                                    placeholder="Search by case number or subject…"
                                    value={problemSearchTerm}
                                    onchange={ND_handleProblemSearch}></lightning-input>

                                <div class="nd-problem-filters">
                                    <button type="button" class={recordTypeChipClass} onclick={ND_toggleFilterRecordType}>
                                        <span>Problem Case only</span>
                                        <lightning-icon icon-name={recordTypeChipIcon} size="xx-small" class="nd-chip-icon"></lightning-icon>
                                    </button>
                                    <button type="button" class={openOnlyChipClass} onclick={ND_toggleFilterOpenOnly}>
                                        <span>Open only</span>
                                        <lightning-icon icon-name={openOnlyChipIcon} size="xx-small" class="nd-chip-icon"></lightning-icon>
                                    </button>
                                </div>

                                <template if:true={problemLoading}>
                                    <div class="nd-problem-msg">Loading…</div>
                                </template>
                                <template if:false={problemLoading}>
                                    <template if:true={problemHasResults}>
                                        <table class="nd-problem-table">
                                            <thead>
                                                <tr>
                                                    <th class="nd-problem-th-num">Case #</th>
                                                    <th>Subject</th>
                                                    <th class="nd-problem-th-status">Status</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template for:each={problemResults} for:item="p">
                                                    <tr key={p.id} class="nd-problem-trow"
                                                        data-id={p.id} data-label={p.label}
                                                        onclick={ND_handleProblemSelect}>
                                                        <td class="nd-problem-num">{p.caseNumber}</td>
                                                        <td class="nd-problem-subj-cell">{p.subject}</td>
                                                        <td class="nd-problem-status-cell">{p.status}</td>
                                                    </tr>
                                                </template>
                                            </tbody>
                                        </table>
                                    </template>
                                    <template if:false={problemHasResults}>
                                        <div class="nd-problem-msg">No open problems found</div>
                                    </template>
                                </template>
                            </div>
                            <footer class="slds-modal__footer">
                                <lightning-button label="Cancel" onclick={ND_closeProblemModal}></lightning-button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>

                <template if:true={linkModalOpen}>
                    <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="nd-link-modal-heading"
                             class="slds-modal slds-fade-in-open">
                        <div class="slds-modal__container">
                            <header class="slds-modal__header">
                                <lightning-button-icon icon-name="utility:close" variant="bare" size="large"
                                    alternative-text="Close" title="Close"
                                    class="slds-modal__close nd-modal-close" onclick={ND_urlListModalCancel}></lightning-button-icon>
                                <h2 id="nd-link-modal-heading" class="slds-modal__title slds-hyphenate">{linkModalTitle}</h2>
                            </header>
                            <div class="slds-modal__content slds-p-around_medium nd-link-modal-content">
                                <lightning-input type="text" label="Label"
                                    placeholder="e.g. Main incident thread"
                                    value={linkModalLabel}
                                    onchange={ND_linkModalLabelChange}></lightning-input>
                                <lightning-input type="url" label="URL" required
                                    class="slds-m-top_small"
                                    placeholder="https://…"
                                    data-role="linkmodal-url"
                                    value={linkModalUrl}
                                    onchange={ND_linkModalUrlChange}></lightning-input>
                            </div>
                            <footer class="slds-modal__footer">
                                <lightning-button label="Cancel" onclick={ND_urlListModalCancel}></lightning-button>
                                <lightning-button variant="brand" label="Save" class="slds-m-left_x-small" onclick={ND_urlListModalSave}></lightning-button>
                            </footer>
                        </div>
                    </section>
                    <div class="slds-backdrop slds-backdrop_open"></div>
                </template>
            </div>
        </article>
    </div>
</template>
